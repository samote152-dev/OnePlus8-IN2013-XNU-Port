name: validate-diagnostic

on:
  push:
    branches: [integration/unixnu-kebab-reference]
    paths:
      - ".github/workflows/validate-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Run verbose repository validation
        id: validate
        continue-on-error: true
        run: |
          set +e
          python3 tools/validate-repo.py --verbose 2>&1 | tee validation.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostic
          path: validation.log
      - name: Preserve validation result
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1

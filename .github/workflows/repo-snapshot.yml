name: repo-snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repo-snapshot.yml"
  push:
    branches: [integration/unixnu-kebab-reference]
    paths:
      - ".github/workflows/repo-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Package repository for offline diagnostics
        run: |
          tar --exclude=.git -czf repo-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot
          path: repo-snapshot.tar.gz

name: qemu-smoke

on:
  push:
    branches: [integration/unixnu-kebab-reference]
    paths:
      - "tools/qemu-sweet.py"
      - ".github/workflows/qemu-smoke.yml"

permissions:
  actions: read
  contents: read

jobs:
  qemu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Wait for the XNU build from the integration branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/xnu.yml/runs?branch=integration%2Funixnu-kebab-reference&per_page=10" --jq '.workflow_runs[0].id // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "No XNU workflow run found for integration branch" >&2
            exit 1
          fi
          echo "Waiting for XNU workflow run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 15
          echo "XNU_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download XNU kernel artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$XNU_RUN_ID" --name xnu-kernel --dir artifacts

      - name: Run QEMU smoke test
        run: |
          python3 tools/qemu-sweet.py \
            --kernel artifacts/kernel.development.instantnoodle \
            --out-dir build/qemu-smoke \
            --timeout 45

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-smoke-logs
          path: |
            build/qemu-smoke/
            shim/out/
          if-no-files-found: warn
